name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    name: Security guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Config files should stay small and readable — a bloated config is where
      # obfuscated payloads hide (this bit a sibling repo once).
      - name: Config files stay under 4KB
        run: |
          oversized=$(find . -path ./node_modules -prune -o -type f -name "*.config.*" -size +4k -print)
          if [ -n "$oversized" ]; then
            echo "Config files over 4KB:"; echo "$oversized"; exit 1
          fi

      - name: No .env files tracked in git
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' || true)
          if [ -n "$tracked" ]; then
            echo "Tracked .env files:"; echo "$tracked"; exit 1
          fi

  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
